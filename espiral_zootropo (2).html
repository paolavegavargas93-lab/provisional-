<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espiral zoótropo | Tinkercad Codeblocks | Misaelverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#070714;--p1:#0d0d22;--p2:#141434;--ln:#262659;
  --cy:#00E5FF;--mg:#FF2BD6;--vi:#8B5CF6;--tx:#ECECFF;--mu:#A6A6D2;
  --or:#F89E4D;--bl:#4585E5;--pu:#9569E5;--gr:#409953;--gr2:#57B45F;--va:#3FB1D8;--ws:#394556;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(1100px 600px at 12% -10%,rgba(139,92,246,.16),transparent 60%);
  color:var(--tx);font-family:'Rajdhani',system-ui,'Segoe UI',Arial,sans-serif;
  font-size:18px;line-height:1.5;min-height:100vh;
}
h1,h2,h3{font-family:'Orbitron','Rajdhani',system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0}
b{font-weight:700;color:#fff}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand .logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:17px;color:var(--cy);letter-spacing:.04em;text-shadow:0 0 12px rgba(0,229,255,.55)}
.brand .serie{color:var(--mu);font-weight:600;font-size:17px}
.hud{display:flex;align-items:center;gap:10px}
.xp{display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--ln);border-radius:999px;background:var(--p1);font-weight:700}
.xp svg{width:18px;height:18px}
.xp span{font-family:'Orbitron',sans-serif;font-size:15px;color:var(--mg)}
.xp.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12);box-shadow:0 0 18px rgba(255,43,214,.6)}}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--p1);color:var(--tx);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* Riel de pasos */
.rail{max-width:1400px;margin:0 auto;padding:4px 24px 10px;overflow-x:auto}
.rail ol{list-style:none;margin:0;padding:6px 2px;display:flex;align-items:center;min-width:max-content}
.rail li{display:flex;align-items:center}
.rail li+li::before{content:"";width:26px;height:2px;background:var(--ln)}
.rail li.passed+li::before{background:var(--cy)}
.node{width:34px;height:34px;border-radius:50%;border:2px solid var(--ln);background:var(--p1);color:var(--mu);font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0}
.node.done{border-color:var(--cy);color:#04121a;background:var(--cy)}
.node.cur{border-color:var(--mg);color:#fff;box-shadow:0 0 0 3px rgba(255,43,214,.25),0 0 16px rgba(255,43,214,.5)}
.node.done.cur{color:#04121a}

/* Distribución */
.grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:28px;max-width:1400px;margin:0 auto;padding:8px 24px 64px;align-items:start}
.lesson{min-width:0}
.count{color:var(--mu);font-weight:600;margin:0 0 6px}
.lesson h2{font-size:clamp(24px,2.6vw,34px);margin-bottom:10px}
.lead{font-size:20px;color:#dcdcff;max-width:66ch;margin:0 0 6px}
.sec{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;color:var(--cy);margin:26px 0 10px}

/* Héroe de inicio */
.hero h1{display:inline-block;font-size:clamp(44px,7vw,92px);font-weight:900;letter-spacing:.01em;line-height:1.02;margin:6px 0 16px;
  background:linear-gradient(100deg,#fff 20%,var(--cy) 55%,var(--mg) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.fig{margin:18px 0 6px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:#fff}
.fig img{display:block;width:100%;height:auto}
.figcap{color:var(--mu);font-size:16px;margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.plain{margin:0;padding-left:20px}
.plain li{margin:4px 0}

/* Chips de bloques en el texto */
.k{display:inline-block;padding:0 8px;border-radius:6px;color:#fff;font-weight:700;white-space:nowrap;line-height:1.45}
.k.or{background:var(--or)}.k.bl{background:var(--bl)}.k.pu{background:var(--pu)}.k.gr{background:var(--gr)}.k.va{background:var(--va)}

/* Lista de acciones */
ol.acts{list-style:none;counter-reset:a;margin:0;padding:0;max-width:70ch}
ol.acts li{counter-increment:a;position:relative;padding:9px 0 9px 46px;border-bottom:1px solid rgba(38,38,89,.7)}
ol.acts li::before{content:counter(a);position:absolute;left:0;top:8px;width:30px;height:30px;border-radius:50%;
  border:2px solid var(--cy);color:var(--cy);font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;display:grid;place-items:center}

/* Espacio de trabajo tipo Codeblocks */
.ws{background:var(--ws);border-radius:12px;padding:18px;overflow-x:auto;margin:16px 0 6px;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px);background-size:20px 20px}
.wsnote{color:var(--mu);font-size:16px;margin:4px 0 0;display:flex;align-items:center;gap:8px}
.wsnote i{display:inline-block;width:16px;height:16px;border-radius:5px;box-shadow:0 0 0 2px var(--mg),0 0 10px var(--mg);background:#fff}
.stack{display:inline-flex;flex-direction:column;align-items:flex-start;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:15px;color:#fff;line-height:1}
.loop{display:flex;flex-direction:column;align-items:flex-start}
.lh{background:var(--or);border-radius:6px 6px 0 0;padding:6px 10px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.lm{display:flex}
.arm{background:var(--or);width:58px;padding:9px 0 0 8px;flex:none}
.mouth{display:flex;flex-direction:column;align-items:flex-start;padding:3px 0}
.lf{background:var(--or);width:290px;height:20px;border-radius:0 0 6px 6px}
.st{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;white-space:nowrap;margin:1px 0}
.st.add{background:var(--bl)}
.st.mod{background:var(--pu)}
.f{display:inline-block;background:#fff;color:#333;border-radius:10px;min-width:24px;padding:3px 7px;text-align:center;font-weight:700}
.grp{background:var(--gr);border-radius:14px;padding:3px 6px;display:inline-flex;align-items:center;gap:5px}
.op{background:var(--gr);border-radius:14px;padding:2px;display:inline-flex;align-items:center;gap:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.var{background:var(--va);border-radius:12px;padding:4px 12px}
.dd{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:3px 6px;border:1px solid rgba(255,255,255,.45)}
.dd i{font-style:normal;font-size:.7em}
.dd.o{background:var(--or)}.dd.g{background:var(--gr)}.dd.lt{background:var(--gr2)}
.shape{background:#fff;border-radius:4px;width:30px;height:30px;display:grid;place-items:center;flex:none}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff,inset 0 0 0 1px rgba(0,0,0,.25);flex:none}
.sw.hole{background:repeating-linear-gradient(45deg,#b8c1cc 0 3px,#e3e8ee 3px 6px);box-shadow:none}
.car{font-size:22px;margin:0 2px}
.chg{box-shadow:0 0 0 2px var(--mg),0 0 14px 3px rgba(255,43,214,.65)!important;animation:glow 1.4s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--mg),0 0 22px 6px rgba(255,43,214,.85)}}
.ws.mini .stack{font-size:12.5px}
.ws.mini .shape{width:24px;height:24px}.ws.mini .sw{width:20px;height:20px}.ws.mini .lf{width:240px;height:14px}

/* Explicación */
.why{margin:18px 0 0;padding:16px 18px;border-left:3px solid var(--vi);background:linear-gradient(90deg,rgba(139,92,246,.12),rgba(139,92,246,0) 85%);border-radius:0 12px 12px 0;max-width:72ch}
.why h3{font-size:15px;color:#cbb8ff;margin-bottom:6px}
.why p{margin:0 0 8px}
.tbl{border-collapse:collapse;margin:10px 0 2px;font-variant-numeric:tabular-nums;font-weight:600}
.tbl th,.tbl td{padding:4px 16px;text-align:right;border-bottom:1px solid rgba(166,166,210,.18)}
.tbl th{color:var(--cy);font-weight:700;text-align:right}
.tbl td.dots{text-align:center;color:var(--mu)}
.note{margin:16px 0 0;padding:12px 16px;border:1px dashed rgba(0,229,255,.45);border-radius:12px;max-width:72ch;color:#d6f9ff}
.warn{margin:16px 0 0;padding:12px 16px;border:1px solid rgba(255,43,214,.5);border-radius:12px;max-width:72ch;background:rgba(255,43,214,.07)}
.note b,.warn b{color:#fff}

/* Leyenda de colores */
.legend{display:grid;gap:8px;margin:14px 0 4px;max-width:70ch}
.legend div{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:12px}
.legend .k{text-align:center}

/* Diagnóstico */
.fix{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.fix div{padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--p1)}
.fix strong{display:block;color:var(--mg);font-weight:700;margin-bottom:2px}
details{margin-top:18px;border:1px solid var(--ln);border-radius:12px;background:var(--p1)}
summary{padding:12px 16px;font-weight:700;cursor:pointer;color:var(--cy)}
details .ws{margin:0 12px 12px}

/* Botones */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--ln)}
.bar .sp{flex:1}
.btn{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;padding:10px 18px;border-radius:10px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);min-height:44px}
.btn:hover{border-color:var(--cy)}
.btn.pri{background:var(--cy);border-color:var(--cy);color:#041018}
.btn.pri:hover{box-shadow:0 0 16px rgba(0,229,255,.55)}
.btn.chk{border-color:var(--mg);color:#ffd6f6}
.btn.chk[aria-pressed="true"]{background:var(--mg);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* Escenario 3D */
.stage{position:sticky;top:14px;height:calc(100vh - 150px);max-height:680px;min-height:440px;display:flex;flex-direction:column;
  border:1px solid var(--ln);border-radius:16px;background:var(--p1);overflow:hidden;box-shadow:0 0 0 1px rgba(0,229,255,.08),0 20px 60px rgba(0,0,0,.45)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.sh h3{font-size:14px;color:var(--cy)}
.sh .n{font-weight:700;color:var(--mu)}
.sh .n b{color:var(--mg);font-family:'Orbitron',sans-serif;font-size:14px}
.view{position:relative;flex:1;min-height:0;background:#eef3f8}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;left:10px;bottom:8px;font-size:14px;font-weight:600;color:#51657a;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid #c5d3e0;background:#fff;color:#2c3e50;font-size:20px;font-weight:700;line-height:1}
.sf{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:1px solid var(--ln)}
.sf .btn{font-size:15px;padding:8px 12px;min-height:40px}
.sf .btn[aria-pressed="true"]{border-color:var(--cy);color:var(--cy)}
.sinfo{padding:8px 14px 0;color:var(--mu);font-size:15px;min-height:22px}

/* Reto final */
.quiz .q{font-size:22px;font-weight:700;margin:10px 0 14px;max-width:62ch}
.opts{display:grid;gap:10px;max-width:640px}
.opt{text-align:left;padding:12px 16px;border-radius:12px;border:1px solid var(--ln);background:var(--p1);color:var(--tx);font-weight:600;font-size:18px}
.opt:hover:not(:disabled){border-color:var(--cy)}
.opt.ok{border-color:#35e59a;background:rgba(53,229,154,.12)}
.opt.no{border-color:#ff5577;background:rgba(255,85,119,.12)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;max-width:62ch}
.fb strong{color:#35e59a}.fb.bad strong{color:#ff7a93}
.qbar{height:6px;border-radius:6px;background:var(--p2);overflow:hidden;max-width:640px;margin-top:8px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg));transition:width .4s}
.res{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin:14px 0 6px}
.grade{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(64px,9vw,104px);line-height:1;color:#fff;text-shadow:0 0 24px rgba(0,229,255,.6)}
.res .lvl{font-size:24px;font-weight:700;color:var(--mg)}
.res .sub{color:var(--mu)}
.review{list-style:none;padding:0;margin:10px 0 0;max-width:70ch}
.review li{padding:8px 0;border-bottom:1px solid rgba(38,38,89,.7)}
.review .mk{font-weight:700;margin-right:6px}

@media (max-width:920px){
  .grid{grid-template-columns:1fr;gap:18px;padding:6px 14px 48px}
  .stage{position:relative;top:0;height:430px;min-height:0;order:-1}
  .sf{flex-wrap:nowrap;gap:6px;padding:8px}.sf .btn{font-size:14px;padding:6px 9px;min-height:38px}
  .sinfo{font-size:14px;padding:6px 12px 0}.hint{font-size:13px}
  .two,.fix{grid-template-columns:1fr}
  .top{padding:12px 14px}.rail{padding:2px 14px 8px}
  .brand{gap:4px 10px}.brand .serie{font-size:14px}
  .legend div{grid-template-columns:1fr}.legend .k{justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* Extras de esta clase */
.st.data{background:#3AA5CF}
.dd.d{background:#3FB1D8}
.op .op{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.var{white-space:nowrap}
.nw{box-shadow:0 0 0 2px var(--mg),0 0 16px 3px rgba(255,43,214,.6);animation:glow 1.4s ease-in-out 3}
.loop.nwl{filter:drop-shadow(0 0 5px rgba(255,43,214,.95))}
.sq{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.zoe{margin:18px 0 0;padding:14px 16px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);max-width:72ch}
.zoe b{color:var(--cy)}
.legend div{grid-template-columns:150px 1fr}
@media (max-width:920px){.legend div{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo">Misaelverse</span>
    <span class="serie">Ciudad generativa: Espiral zoótropo</span>
  </div>
  <div class="hud">
    <div class="xp" id="xp" aria-live="polite" title="Puntos de experiencia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="#FF2BD6"/></svg>
      <span id="xpv">0</span> XP
    </div>
    <button class="iconbtn" id="snd" aria-pressed="true" aria-label="Sonido activado" title="Sonido">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="sndw" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<nav class="rail" aria-label="Pasos del tutorial"><ol id="rail"></ol></nav>

<main class="grid">
  <section class="lesson" id="lesson" aria-live="polite"></section>

  <aside class="stage" aria-label="Vista previa 3D">
    <div class="sh">
      <h3>Vista previa</h3>
      <div class="n">Cubos: <b id="cnt">0</b></div>
    </div>
    <div class="sinfo" id="sinfo"></div>
    <div class="view">
      <canvas id="cv" aria-label="Simulación 3D de la espiral de cubos. Arrastra para girar la vista."></canvas>
      <div class="zoom">
        <button id="zin" aria-label="Acercar">+</button>
        <button id="zout" aria-label="Alejar">−</button>
      </div>
      <div class="hint">Arrastra para girar la vista</div>
    </div>
    <div class="sf">
      <button class="btn" id="replay">Repetir construcción</button>
      <button class="btn" id="vPer" aria-pressed="true">Perspectiva</button>
      <button class="btn" id="vTop" aria-pressed="false">Vista superior</button>
    </div>
  </aside>
</main>

/* ---------- Utilidades de color y números ---------- */
function hsv(h){ // saturación y brillo al 100 %
  h=((h%360)+360)%360; const x=1-Math.abs((h/60)%2-1); let r=0,g=0,b=0;
  if(h<60){r=1;g=x}else if(h<120){r=x;g=1}else if(h<180){g=1;b=x}else if(h<240){g=x;b=1}else if(h<300){r=x;b=1}else{r=1;b=x}
  return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
}

let actx=null, muted=false;
function tone(f,d,type,vol,when){
  if(muted) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime+(when||0), o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.06,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.03);
  }catch(e){}
}

  step(){tone(640,.08,"triangle",.05)},

  bad(){tone(196,.22,"sawtooth",.03)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.06,i*.12))}
};

function program(lvl,fresh){
  const N=k=>fresh===k;
  let h=SET("lado",F(20),N("vars"))+SET("distancia",F(99),N("vars"));
  if(lvl<LV.loop) return h;
  let body=ST("add",`Añadir <span class="shape">${CUBE}</span><span class="sw" style="--c:#D0202D"></span><span class="sw hole"></span><span class="car">‹</span> A ${VAR("lado")} L ${VAR("lado")} A ${VAR("lado")} arista ${F(0)}`,N("loop"));
  if(lvl>=LV.color) body+=ST("mod",`Definir color Tonalidad ${OP(F(75),"+",VAR("i"))} Saturación ${F(100)} Brillo ${F(100)}`,N("color"));
  if(lvl>=LV.tilt) body+=ST("mod",`Girar alrededor <span class="dd g">Eje y<i>▾</i></span> en ${OP(OP(VAR("i"),"*",F(4)),"+",F(2))} Grados desde pivote ${XYZ(F(0),F(0),F(0))}`,N("tilt"));
  if(lvl>=LV.move){
    body+=ST("mod",`Mover: <span class="grp">X: ${OP(F(119),"-",VAR("distancia"))} Y: ${F(0)} Z: ${F(0)}</span>`,N("move"));
    body+=ST("mod",`Girar alrededor <span class="dd g">Eje z<i>▾</i></span> en ${OP(VAR("i"),"*",F(62.5))} Grados desde pivote ${XYZ(F(0),F(0),F(0))}`,N("move"));
  }
  if(lvl>=LV.shrink){
    body+=SET("lado",OP(VAR("lado"),"*",F(0.99)),N("shrink"));
    body+=SET("distancia",OP(VAR("distancia"),"*",F(0.99)),N("shrink"));
  }
  h+=`<div class="loop${N("loop")?" nwl":""}"><div class="lh">Contar con <span class="dd o">i<i>▾</i></span> desde ${F(0)} a ${F(194)} en ${F(1)}</div><div class="lm"><div class="arm">Hacer</div><div class="mouth">${body}</div></div><div class="lf"></div></div>`;
  if(lvl>=LV.pin){
    h+=ST("add",`Añadir <span class="shape">${CYL}</span><span class="sw" style="--c:#F5831F"></span><span class="sw hole"></span><span class="car">‹</span> Radio ${F(0.1)} Altura ${F(10)}`,N("pin"));
    h+=ST("mod",`Mover: ${XYZ(F(0),F(0),F(5))}`,N("pin"));
  }
  return h;
}

const ROWS=[0,1,2,3,"…",194];
function table(kind){
  if(!kind) return "";
  let head, row, rows=ROWS;
  if(kind==="loop"){ head=["i","lado"]; row=i=>[i,"20"]; }
  else if(kind==="move"){ head=["i","X = 119 − 99","Giro = i × 62,5"]; row=i=>[i,"20",nf(i*62.5,1)+"°"]; }
  else if(kind==="shrink"){ head=["i","lado","distancia","X = 119 − distancia"];
    row=i=>{const f=Math.pow(0.99,i);return [i,nf(20*f,2),nf(99*f,2),nf(119-99*f,2)];}; }
  else if(kind==="tilt"){ head=["i","Voltereta = i × 4 + 2"]; row=i=>[i,(i*4+2)+"°"]; }
  else if(kind==="color"){ head=["i","H = 75 + i","Color"]; rows=[0,45,105,165,194];
    const nm={75:"verde amarillo",120:"verde",180:"cian",240:"azul",269:"morado"};
    row=i=>[i,75+i,`<span class="sq" style="background:${css(hsv(75+i))}"></span> ${nm[75+i]}`]; }
  const th=`<tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr>`;
  const trs=rows.map(i=>i==="…"?`<tr><td class="dots" colspan="${head.length}">…</td></tr>`:`<tr>${row(i).map(x=>`<td>${x}</td>`).join("")}</tr>`).join("");
  return `<table class="tbl">${th}${trs}</table>`;
}

function makeCube(n,lvl){
  const f=lvl>=LV.shrink?Math.pow(0.99,n):1, h=10*f;
  const b=lvl>=LV.tilt?(4*n+2)*Math.PI/180:0, cb=Math.cos(b), sb=Math.sin(b);
  const tx=lvl>=LV.move?119-99*f:0;
  const th=lvl>=LV.move?62.5*n*Math.PI/180:0, c=Math.cos(th), s=Math.sin(th);
  const tr=p=>{ // girar en y, mover en x, girar alrededor de z
    const x1=p[0]*cb+p[2]*sb, z1=-p[0]*sb+p[2]*cb, x2=x1+tx;
    return [x2*c-p[1]*s, x2*s+p[1]*c, z1];
  };
  const trN=p=>{const x1=p[0]*cb+p[2]*sb, z1=-p[0]*sb+p[2]*cb; return [x1*c-p[1]*s, x1*s+p[1]*c, z1];};
  const V=[]; for(let k=0;k<8;k++) V.push(tr([k&1?h:-h,k&2?h:-h,k&4?h:-h]));
  return {V,N:NL.map(trN),c:tr([0,0,0]),rgb:lvl>=LV.color?hsv(75+n):RED};
}

let cubes=[], shown=0, anim=null, showPin=false;
const cntEl=document.getElementById("cnt"), sinfo=document.getElementById("sinfo");
function setScene(lvl,animate){
  cubes=[]; if(lvl>=LV.loop) for(let n=0;n<=194;n++) cubes.push(makeCube(n,lvl));
  showPin=lvl>=LV.pin;
  const total=cubes.length;
  if(reduce||!animate||!total){ anim=null; shown=total; }
  else { shown=0; anim={a:0,b:total,t0:performance.now(),dur:2200}; }
  cntEl.textContent=shown; dirty();
}
const INFO={
  vars:"Todavía no hay cubos: las variables solo guardan números.",
  loop:"195 cubos del mismo tamaño en el mismo lugar: parece uno solo.",
  move:"Todos a 20 del centro: un anillo de cubos grandes.",
  shrink:"Cada cubo 1 % más pequeño y un poco más lejos: aparece la espiral.",
  tilt:"Ahora cada cubo se voltea 4° más que el anterior.",
  color:"El tono va de 75 (verde amarillo) a 269 (morado).",
  pin:"La varilla naranja queda en el centro."
};
function aimCam(d){ if(reduce){cam.dist=d;return;} camT=Object.assign(camT||{},{dist:d}); }
let introPlayed=false;
function stageFor(i){
  const s=STEPS[i];
  if(s.type==="build"){
    const lvl=LV[s.key];
    aimCam(lvl<=LV.loop?110:lvl===LV.move?190:420);
    setScene(lvl,lvl>=LV.loop);
    sinfo.textContent=INFO[s.key];
  }else if(s.type==="run"){
    aimCam(420); setScene(LV.pin,true); sinfo.textContent="El código completo: así queda la escultura.";
  }else{
    aimCam(420); setScene(LV.pin,i===0&&!introPlayed); introPlayed=true;
    sinfo.textContent=i===0?"Esta es la escultura que vas a programar.":"La escultura completa, como referencia.";
  }
}
document.getElementById("replay").addEventListener("click",()=>stageFor(cur));
function setView(v){
  const t=v==="top"?TOP:PER; camT=Object.assign(camT||{},{yaw:t.yaw,pitch:t.pitch});
  if(reduce){cam.yaw=t.yaw;cam.pitch=t.pitch;camT=null;}
  document.getElementById("vTop").setAttribute("aria-pressed",String(v==="top"));
  document.getElementById("vPer").setAttribute("aria-pressed",String(v!=="top"));
  dirty();
}
document.getElementById("vTop").addEventListener("click",()=>setView("top"));
document.getElementById("vPer").addEventListener("click",()=>setView("per"));
document.getElementById("zin").addEventListener("click",()=>{if(camT)delete camT.dist;cam.dist=Math.max(60,cam.dist*0.85);dirty();});
document.getElementById("zout").addEventListener("click",()=>{if(camT)delete camT.dist;cam.dist=Math.min(1200,cam.dist/0.85);dirty();});

let drag=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);if(camT){delete camT.yaw;delete camT.pitch;}});
cv.addEventListener("pointermove",e=>{
  if(!drag) return;
  cam.yaw-=(e.clientX-drag.x)*0.008;
  cam.pitch=Math.min(1.54,Math.max(0.1,cam.pitch+(e.clientY-drag.y)*0.006));
  drag={x:e.clientX,y:e.clientY}; dirty();
});
const endDrag=()=>{drag=null;};
cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("wheel",e=>{e.preventDefault();if(camT)delete camT.dist;cam.dist=Math.min(1200,Math.max(60,cam.dist*(1+e.deltaY*0.001)));dirty();},{passive:false});

function resize(){
  const r=cv.parentElement.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,1.5);
  W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); dirty();
}
window.addEventListener("resize",resize);

let pending=false;
function dirty(){ if(!pending){pending=true;requestAnimationFrame(frame);} }
function frame(t){
  pending=false; let more=false;
  if(anim){
    const p=Math.min(1,(t-anim.t0)/anim.dur);
    shown=Math.round(anim.a+(anim.b-anim.a)*p); cntEl.textContent=shown;
    if(p<1) more=true; else anim=null;
  }
  if(camT){
    let busy=false;
    for(const k of ["yaw","pitch","dist"]){
      if(camT[k]===undefined) continue;
      const tol=k==="dist"?0.5:0.002;
      cam[k]+=(camT[k]-cam[k])*0.16;
      if(Math.abs(camT[k]-cam[k])<tol){cam[k]=camT[k];delete camT[k];} else busy=true;
    }
    if(busy) more=true; else camT=null;
  }
  draw();
  if(more) dirty();
}

function draw(){
  if(!W||!H) return;
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch), cyw=Math.cos(cam.yaw), syw=Math.sin(cam.yaw);
  const C=[cam.dist*cp*syw, -cam.dist*cp*cyw, cam.dist*sp];
  const f=[-C[0]/cam.dist,-C[1]/cam.dist,-C[2]/cam.dist];
  let r=[f[1],-f[0],0]; const rm=Math.hypot(r[0],r[1])||1; r=[r[0]/rm,r[1]/rm,0];
  const u=[r[1]*f[2], -r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  const focal=Math.min(W*1.25,H*1.75), cx=W/2, cy=H/2+H*0.03;
  const P=p=>{
    const dx=p[0]-C[0], dy=p[1]-C[1], dz=p[2]-C[2];
    const z=dx*f[0]+dy*f[1]+dz*f[2]; if(z<4) return null;
    const s=focal/z; return [cx+(dx*r[0]+dy*r[1]+dz*r[2])*s, cy-(dx*u[0]+dy*u[1]+dz*u[2])*s];
  };
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#f8fbfd"); g.addColorStop(1,"#dfe8f1");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // plano de trabajo 200 x 200
  const E=100, corners=[[-E,-E,0],[E,-E,0],[E,E,0],[-E,E,0]].map(P);
  if(corners.every(Boolean)){
    ctx.beginPath(); corners.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
    ctx.fillStyle="rgba(178,220,242,.55)"; ctx.fill(); ctx.lineWidth=1;
    for(let v=-E;v<=E;v+=10){
      ctx.strokeStyle=v%50===0?"rgba(90,160,205,.55)":"rgba(120,185,225,.35)";
      const a=P([v,-E,0]),b=P([v,E,0]),c2=P([-E,v,0]),d=P([E,v,0]);
      ctx.beginPath(); if(a&&b){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);} if(c2&&d){ctx.moveTo(c2[0],c2[1]);ctx.lineTo(d[0],d[1]);} ctx.stroke();
    }
    ctx.strokeStyle="rgba(70,150,200,.9)"; ctx.lineWidth=1.4;
    ctx.beginPath(); corners.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.stroke();
  }
  const o=P([0,0,0]);
  [[[22,0,0],"#e0443e"],[[0,22,0],"#3aa655"],[[0,0,22],"#3a6fe0"]].forEach(([p,col])=>{
    const q=P(p); if(o&&q){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o[0],o[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();}
  });
  if(showPin){ const a=P([0,0,0]),b=P([0,0,10]); if(a&&b){ctx.strokeStyle="#F5831F";ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();} }
  // cubos ordenados de atrás hacia adelante
  const list=[];
  for(let i=0;i<shown&&i<cubes.length;i++){
    const B=cubes[i]; list.push([(B.c[0]-C[0])*f[0]+(B.c[1]-C[1])*f[1]+(B.c[2]-C[2])*f[2],B]);
  }
  list.sort((a,b)=>b[0]-a[0]);
  ctx.lineJoin="round";
  for(const [,B] of list){
    for(let fi=0;fi<6;fi++){
      const n=B.N[fi], idx=FACES[fi];
      const q0=B.V[idx[0]];
      let mx=(q0[0]+B.V[idx[2]][0])/2,my=(q0[1]+B.V[idx[2]][1])/2,mz=(q0[2]+B.V[idx[2]][2])/2;
      if(n[0]*(C[0]-mx)+n[1]*(C[1]-my)+n[2]*(C[2]-mz)<=0) continue;
      const pts=[]; let ok=true;
      for(const k of idx){const q=P(B.V[k]); if(!q){ok=false;break;} pts.push(q);}
      if(!ok) continue;
      const l=0.6+0.4*Math.max(0,n[0]*LD[0]+n[1]*LD[1]+n[2]*LD[2]);
      ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); ctx.lineTo(pts[1][0],pts[1][1]); ctx.lineTo(pts[2][0],pts[2][1]); ctx.lineTo(pts[3][0],pts[3][1]); ctx.closePath();
      ctx.fillStyle=`rgb(${B.rgb[0]*l|0},${B.rgb[1]*l|0},${B.rgb[2]*l|0})`; ctx.fill();
      ctx.strokeStyle="rgba(30,45,60,.35)"; ctx.lineWidth=.7; ctx.stroke();
    }
  }
}

/* ---------- Inicio ---------- */
renderLesson(); renderRail();
resize();
stageFor(0);
})();
</script>
